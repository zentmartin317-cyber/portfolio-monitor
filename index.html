<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KI Portfolio Monitor (Automated)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0d14; --surface: #0f1420; --card: #141b2d; --border: #1e2a42;
      --accent: #00d4ff; --green: #00e57a; --gold: #f0a500; --red: #ff4d6d;
      --purple: #9b6dff; --text: #e2e8f0; --muted: #64748b;
    }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 28px; }
    .header-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .badge-text { color: var(--muted); font-size: 11px; letter-spacing: 2px; font-family: 'IBM Plex Mono', monospace; }
    h1 { font-size: 24px; font-weight: 800; } h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    @media(max-width: 600px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .summary-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; margin-bottom: 4px; }
    .summary-value { font-weight: 800; font-size: 15px; font-family: 'IBM Plex Mono', monospace; }
    .stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    .card-header { padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .ticker-badge { border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 800; font-family: 'IBM Plex Mono', monospace; }
    .stock-name { font-weight: 700; font-size: 14px; }
    .stock-segment { color: var(--muted); font-size: 11px; }
    .current-price { font-weight: 800; font-size: 17px; font-family: 'IBM Plex Mono', monospace; }
    .price-label { color: var(--muted); font-size: 10px; text-align: right; }
    .footer { color: var(--muted); font-size: 10px; text-align: center; margin-top: 30px; }
    .loading { color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-bottom: 15px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-badge">
      <div class="live-dot"></div>
      <span class="badge-text">LIVE API WATCHLIST (AUTOMATISIERT)</span>
    </div>
    <h1>Portfolio <span>Monitor</span></h1>
    <div class="subtitle" id="lastUpdate">Lade Live-Daten von der Börse...</div>
  </div>

  <div id="loadingStatus" class="loading">🔄 Verbinde mit Alpha Vantage API via Proxy...</div>
  <div class="summary-grid" id="summaryGrid"></div>
  <div id="stockCards"></div>

  <div class="footer">⚠️ Automatischer Abruf via Alpha Vantage & CORS-Proxy<br>Stand Juli 2026</div>
</div>

<script>
// TRAGE HIER DEINEN ALPHA VANTAGE API-KEY EIN:
const API_KEY = 'HCW4EHPUFQ8TTZF6'; 

let WATCHLIST = [
  { ticker:"APH", name:"Amphenol", segment:"Connectivity", icon:"🔗", currentEUR: 0, target: 108 },
  { ticker:"ETN", name:"Eaton Corp.", segment:"Grid & Power", icon:"⚡", currentEUR: 0, target: 338 },
  { ticker:"GEV", name:"GE Vernova", segment:"Grid & Power", icon:"⚡", currentEUR: 0, target: 860 },
  { ticker:"FCX", name:"Freeport-McMoRan", segment:"Rohstoffe", icon:"⛏", currentEUR: 0, target: 50 },
  { ticker:"VRT", name:"Vertiv Holdings", segment:"Cooling", icon:"🔗", currentEUR: 0, target: 285 },
  { ticker:"ANET", name:"Arista Networks", segment:"AI Networking", icon:"🌐", currentEUR: 0, target: 122 }
];

async function fetchLivePrices() {
  if (API_KEY === 'DEIN_API_KEY_HIER' || !API_KEY) {
    document.getElementById("loadingStatus").innerHTML = "❌ Bitte trage im Code deinen echten Alpha Vantage API-Key ein!";
    return;
  }

  let successCount = 0;
  for (let stock of WATCHLIST) {
    try {
      // Wir nutzen einen öffentlichen CORS-Proxy (corsproxy.io), der den Abruf erlaubt
      const targetUrl = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${stock.ticker}&apikey=${API_KEY}`;
      const proxyUrl = `https://corsproxy.io/?url=` + encodeURIComponent(targetUrl);
      
      const response = await fetch(proxyUrl);
      const data = await response.json();
      
      const quote = data["Global Quote"];
      if (quote && quote["05. price"]) {
        stock.currentEUR = parseFloat(quote["05. price"]);
        successCount++;
      }
    } catch (e) {
      console.error(`Fehler bei ${stock.ticker}:`, e);
    }
  }

  document.getElementById("loadingStatus").innerHTML = `✅ ${successCount} von ${WATCHLIST.length} Kursen erfolgreich live aktualisiert!`;
  document.getElementById("lastUpdate").textContent = "Zuletzt aktualisiert: " + new Date().toLocaleString("de-DE");
  renderUI();
}

function renderUI() {
  document.getElementById("summaryGrid").innerHTML = `
    <div class="summary-card">
      <div class="summary-label">POSITIONEN</div>
      <div class="summary-value" style="color:var(--purple)">${WATCHLIST.length} Aktien</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">STATUS</div>
      <div class="summary-value" style="color:var(--green)">Live Verbunden</div>
    </div>`;

  document.getElementById("stockCards").innerHTML = WATCHLIST.map(s => `
    <div class="stock-card">
      <div class="card-header">
        <div class="card-left">
          <span style="font-size:20px">${s.icon}</span>
          <div class="ticker-badge" style="background:rgba(0,212,255,0.15);color:var(--accent)">${s.ticker}</div>
          <div>
            <div class="stock-name">${s.name}</div>
            <div class="stock-segment">${s.segment}</div>
          </div>
        </div>
        <div>
          <div class="current-price">${s.currentEUR > 0 ? s.currentEUR.toFixed(2) + " $" : "Lade..."}</div>
          <div class="price-label">Live Kurs</div>
        </div>
      </div>
    </div>`).join("");
}

// Start beim Laden der Seite
fetchLivePrices();
</script>
</body>
</html>
